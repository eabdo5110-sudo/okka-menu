<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OKKA Coffee | Admin Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Cairo Font -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style> body { font-family: 'Cairo', sans-serif; } </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        okka: { 600: '#8B4513', 800: '#5c2c0c', 900: '#3d1d07' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-stone-900 text-stone-100 min-h-screen flex flex-col justify-center items-center p-4">

    <!-- Login Box -->
    <div id="loginBox" class="bg-white text-stone-800 p-8 rounded-2xl shadow-2xl w-full max-w-sm space-y-4">
        <div class="text-center pb-2 border-b">
            <h2 class="text-xl font-black text-okka-900"><i class="fa-solid fa-lock text-amber-600 ml-2"></i> لوحة تحكم أوكا</h2>
            <p class="text-xs text-stone-500 mt-1">الرجاء إدخال الرمز السري للمتابعة</p>
        </div>
        <div>
            <label class="block text-xs font-bold text-stone-600 mb-1">الرمز السري (PIN)</label>
            <input type="password" id="adminPin" placeholder="أدخل الرمز السري" class="w-full px-3 py-2 border rounded-xl text-center text-lg tracking-widest focus:ring-2 focus:ring-amber-500 focus:outline-none">
        </div>
        <button onclick="verifyAdmin()" class="w-full bg-okka-900 hover:bg-black text-white py-3 rounded-xl font-bold transition text-sm shadow-md">
            تسجيل الدخول
        </button>
        <div class="text-center">
            <a href="index.html" class="text-xs text-amber-700 hover:underline font-bold">← العودة لموقع المنيو</a>
        </div>
    </div>

    <!-- Dashboard Content (Hidden by default until login) -->
    <div id="dashboardBox" class="hidden w-full max-w-5xl bg-stone-900 text-stone-800 space-y-6">
        <div class="bg-okka-900 text-white p-4 rounded-2xl flex justify-between items-center shadow-lg">
            <h3 class="font-bold text-lg"><i class="fa-solid fa-gauge-high ml-2"></i> إدارة مطعم أوكا</h3>
            <div class="space-x-3 space-x-reverse">
                <a href="index.html" target="_blank" class="bg-amber-600 hover:bg-amber-700 text-white px-3 py-1.5 rounded-xl text-xs font-bold transition">عرض المنيو</a>
                <button onclick="logoutAdmin()" class="bg-red-500 hover:bg-red-600 text-white px-3 py-1.5 rounded-xl text-xs font-bold transition">خروج</button>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- WhatsApp Settings -->
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-stone-200 space-y-3">
                <h4 class="font-bold text-stone-700 text-sm"><i class="fa-brands fa-whatsapp text-green-600 ml-1"></i> رقم واتساب لاستقبال الطلبات</h4>
                <div class="flex gap-2">
                    <input type="text" id="whatsappNumberInput" placeholder="مثال: 201012345678" class="flex-grow px-3 py-2 border rounded-xl text-sm text-right">
                    <button onclick="saveWhatsAppNumber()" class="bg-green-600 hover:bg-green-700 text-white font-bold px-4 py-2 rounded-xl text-sm transition">حفظ</button>
                </div>
            </div>

            <!-- Add Category -->
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-stone-200 space-y-3">
                <h4 class="font-bold text-stone-700 text-sm"><i class="fa-solid fa-folder-plus text-amber-600 ml-1"></i> إضافة قسم جديد</h4>
                <div class="flex gap-2">
                    <input type="text" id="newCategoryName" placeholder="اسم القسم الجديد (مثل: عصائر طازجة)" class="flex-grow px-3 py-2 border rounded-xl text-sm text-right">
                    <button onclick="addNewCategory()" class="bg-amber-600 hover:bg-amber-700 text-white font-bold px-4 py-2 rounded-xl text-sm transition">إضافة</button>
                </div>
            </div>
        </div>

        <!-- Add New Item -->
        <div class="bg-white p-5 rounded-2xl shadow-sm border border-stone-200">
            <h4 class="font-bold text-stone-700 mb-3 text-sm"><i class="fa-solid fa-plus-circle text-amber-600 ml-1"></i> إضافة صنف جديد</h4>
            <div class="grid grid-cols-1 sm:grid-cols-4 gap-3">
                <input type="text" id="newItemName" placeholder="اسم الصنف (عربي أو إنجليزي)" class="px-3 py-2 border rounded-xl text-sm text-right">
                <select id="newItemCategory" class="px-3 py-2 border rounded-xl text-sm">
                    <!-- Dynamic categories loaded via JS -->
                </select>
                <input type="number" id="newItemPrice" placeholder="السعر (ج.م)" class="px-3 py-2 border rounded-xl text-sm text-right">
                <button onclick="addNewItem()" class="bg-amber-600 hover:bg-amber-700 text-white font-bold py-2 rounded-xl text-sm transition">إضافة الصنف</button>
            </div>
        </div>

        <!-- Products Table -->
        <div class="bg-white p-5 rounded-2xl shadow-sm border border-stone-200">
            <h4 class="font-bold text-stone-700 mb-3 text-sm"><i class="fa-solid fa-list text-amber-600 ml-1"></i> إدارة الأسعار والأصناف</h4>
            <div class="overflow-x-auto">
                <table class="w-full text-right text-sm">
                    <thead class="bg-stone-50 border-b text-stone-600">
                        <tr>
                            <th class="p-3">اسم الصنف</th>
                            <th class="p-3">القسم</th>
                            <th class="p-3">السعر (ج.م)</th>
                            <th class="p-3 text-center">الإجراءات</th>
                        </tr>
                    </thead>
                    <tbody id="adminProductsTable" class="divide-y divide-stone-100"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const defaultProducts = [
            { id: 1, name: "Espresso", nameAr: "إسبريسو", category: "مشروبات ساخنة", price: 45, image: "https://images.unsplash.com/photo-1510591509098-f4fdc6d0ff04?w=400" },
            { id: 2, name: "Hot Spanish Latte", nameAr: "هوت سبانش لاتيه", category: "مشروبات ساخنة", price: 75, image: "https://images.unsplash.com/photo-1570968915860-54d5c301fa9f?w=400" },
            { id: 3, name: "Cappuccino", nameAr: "كابتشينو", category: "مشروبات ساخنة", price: 60, image: "https://images.unsplash.com/photo-1572442388796-11668a67e53d?w=400" },
            { id: 4, name: "Iced Spanish Latte", nameAr: "ايس سبانش لاتيه", category: "مشروبات باردة", price: 80, image: "https://images.unsplash.com/photo-1517701550927-30cf4ba1dba5?w=400" },
            { id: 5, name: "Passion Fruit Mojito", nameAr: "موهيتو باشن فروت", category: "مشروبات باردة", price: 65, image: "https://images.unsplash.com/photo-1551024709-8f23befc6f87?w=400" },
            { id: 6, name: "Chocolate Cheesecake", nameAr: "تشيز كيك الشوكولاتة", category: "حلويات ومخبوزات", price: 90, image: "https://images.unsplash.com/photo-1533134242443-d4fd215305ad?w=400" },
            { id: 7, name: "Chocolate Croissant", nameAr: "كرواسون شوكولاتة", category: "حلويات ومخبوزات", price: 50, image: "https://images.unsplash.com/photo-1555507036-ab1f4038808a?w=400" }
        ];

        let products = JSON.parse(localStorage.getItem('okka_products')) || defaultProducts;
        let customCategories = JSON.parse(localStorage.getItem('okka_categories')) || [];
        let cafeWhatsApp = localStorage.getItem('okka_whatsapp') || "2010xxxxxxxx";

        function verifyAdmin() {
            if (document.getElementById('adminPin').value === '8899') {
                document.getElementById('loginBox').classList.add('hidden');
                document.getElementById('dashboardBox').classList.remove('hidden');
                document.getElementById('whatsappNumberInput').value = cafeWhatsApp;
                loadCategorySelect();
                renderAdminProducts();
            } else {
                alert('رمز PIN غير صحيح!');
            }
        }

        function logoutAdmin() {
            document.getElementById('dashboardBox').classList.add('hidden');
            document.getElementById('loginBox').classList.remove('hidden');
            document.getElementById('adminPin').value = '';
        }

        function getAllCategories() {
            const defaultCats = [...new Set(products.map(p => p.category))];
            return [...new Set([...defaultCats, ...customCategories])];
        }

        function loadCategorySelect() {
            const select = document.getElementById('newItemCategory');
            select.innerHTML = '';
            getAllCategories().forEach(cat => {
                select.innerHTML += `<option value="${cat}">${cat}</option>`;
            });
        }

        function addNewCategory() {
            const name = document.getElementById('newCategoryName').value.trim();
            if(!name) { alert('الرجاء إدخال اسم القسم'); return; }
            if(!customCategories.includes(name)) {
                customCategories.push(name);
                localStorage.setItem('okka_categories', JSON.stringify(customCategories));
                document.getElementById('newCategoryName').value = '';
                loadCategorySelect();
                alert('تم إضافة القسم بنجاح!');
            } else {
                alert('هذا القسم موجود بالفعل.');
            }
        }

        function saveWhatsAppNumber() {
            const num = document.getElementById('whatsappNumberInput').value.trim();
            if(num) {
                cafeWhatsApp = num;
                localStorage.setItem('okka_whatsapp', num);
                alert('تم حفظ رقم الواتساب بنجاح!');
            }
        }

        function renderAdminProducts() {
            const tbody = document.getElementById('adminProductsTable');
            tbody.innerHTML = '';
            products.forEach((p) => {
                tbody.innerHTML += `
                    <tr class="hover:bg-stone-50">
                        <td class="p-3 font-bold text-stone-800">${p.nameAr || p.name}</td>
                        <td class="p-3 text-stone-500 font-bold">${p.category}</td>
                        <td class="p-3"><input type="number" value="${p.price}" id="price-${p.id}" class="w-24 px-2 py-1 border rounded-lg text-sm font-bold text-right"> ج.م</td>
                        <td class="p-3 text-center space-x-2 space-x-reverse">
                            <button onclick="updatePrice(${p.id})" class="bg-amber-600 hover:bg-amber-700 text-white px-3 py-1 rounded-lg text-xs font-bold">حفظ</button>
                            <button onclick="deleteProduct(${p.id})" class="bg-red-500 hover:bg-red-600 text-white px-3 py-1 rounded-lg text-xs font-bold">حذف</button>
                        </td>
                    </tr>
                `;
            });
        }

        function updatePrice(id) {
            const newPrice = parseFloat(document.getElementById(`price-${id}`).value);
            const p = products.find(item => item.id === id);
            if (p && !isNaN(newPrice)) {
                p.price = newPrice;
                localStorage.setItem('okka_products', JSON.stringify(products));
                alert('تم تحديث السعر!');
                renderAdminProducts();
            }
        }

        function deleteProduct(id) {
            if (confirm('هل أنت متأكد من الحذف؟')) {
                products = products.filter(p => p.id !== id);
                localStorage.setItem('okka_products', JSON.stringify(products));
                renderAdminProducts();
            }
        }

        function addNewItem() {
            const name = document.getElementById('newItemName').value.trim();
            const category = document.getElementById('newItemCategory').value;
            const price = parseFloat(document.getElementById('newItemPrice').value);

            if (!name || isNaN(price)) {
                alert('الرجاء إدخال اسم الصنف والسعر بشكل صحيح.');
                return;
            }

            products.push({
                id: Date.now(),
                name: name,
                nameAr: name,
                category: category,
                price: price,
                image: "https://images.unsplash.com/photo-1541167760496-1628856ab772?w=400"
            });

            localStorage.setItem('okka_products', JSON.stringify(products));
            document.getElementById('newItemName').value = '';
            document.getElementById('newItemPrice').value = '';
            renderAdminProducts();
            alert('تمت إضافة الصنف بنجاح!');
        }
    </script>
</body>
</html>
